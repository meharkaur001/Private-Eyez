<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRIVATE EYEZ // CLASSMATE DOSSIER SYSTEM</title>
  <style>
    :root {
      --bg-color: #080d12;
      --crt-color: #00ffcc;
      --crt-dim: #007766;
      --crt-glow: rgba(0, 255, 204, 0.4);
      --amber-color: #ffb700;
      --danger-color: #ff3366;
      --panel-bg: rgba(10, 20, 26, 0.85);
      --font-stack: "Courier New", Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--crt-color);
      font-family: var(--font-stack);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      text-shadow: 0 0 4px var(--crt-glow);
    }

    /* CRT Scanline Overlay */
    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 99;
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
    }

    /* Passcode Lock Screen Overlay */
    #lock-screen {
      position: fixed;
      inset: 0;
      background: var(--bg-color);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lock-box {
      border: 2px solid var(--crt-color);
      background: var(--panel-bg);
      padding: 30px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 15px var(--crt-glow);
    }

    .lock-title {
      font-size: 1.4rem;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    .lock-sub {
      font-size: 0.85rem;
      color: var(--crt-dim);
      margin-bottom: 20px;
    }

    .lock-input {
      width: 100%;
      background: #000;
      border: 1px solid var(--crt-color);
      color: var(--crt-color);
      font-family: var(--font-stack);
      padding: 10px;
      font-size: 1.1rem;
      text-align: center;
      letter-spacing: 4px;
      margin-bottom: 15px;
      outline: none;
    }

    .lock-input:focus {
      box-shadow: 0 0 8px var(--crt-glow);
    }

    .terminal-btn {
      background: transparent;
      border: 1px solid var(--crt-color);
      color: var(--crt-color);
      font-family: var(--font-stack);
      padding: 8px 16px;
      cursor: pointer;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }

    .terminal-btn:hover {
      background: var(--crt-color);
      color: var(--bg-color);
      box-shadow: 0 0 10px var(--crt-glow);
    }

    .error-msg {
      color: var(--danger-color);
      margin-top: 10px;
      font-size: 0.85rem;
      display: none;
      text-shadow: 0 0 4px var(--danger-color);
    }

    /* Header Bar */
    header {
      border-bottom: 2px solid var(--crt-color);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      background: var(--panel-bg);
    }

    .logo-text {
      font-size: 1.3rem;
      letter-spacing: 2px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* Main Container */
    .container {
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
      flex-grow: 1;
    }

    /* Status Panel */
    .status-panel {
      border: 1px solid var(--crt-dim);
      padding: 15px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 255, 204, 0.03);
      font-size: 0.85rem;
    }

    /* Form & Profile Cards */
    .section-title {
      border-bottom: 1px dashed var(--crt-dim);
      padding-bottom: 5px;
      margin-bottom: 15px;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    .entry-form {
      border: 1px solid var(--crt-color);
      padding: 20px;
      background: var(--panel-bg);
      margin-bottom: 30px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 0.8rem;
      color: var(--crt-dim);
      text-transform: uppercase;
    }

    .form-control {
      background: #04080a;
      border: 1px solid var(--crt-dim);
      color: var(--crt-color);
      font-family: var(--font-stack);
      padding: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--crt-color);
      box-shadow: 0 0 5px var(--crt-glow);
    }

    /* Profile List */
    .profiles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }

    .profile-card {
      border: 1px solid var(--crt-dim);
      background: var(--panel-bg);
      padding: 15px;
      position: relative;
    }

    .profile-card:hover {
      border-color: var(--crt-color);
      box-shadow: 0 0 8px var(--crt-glow);
    }

    .profile-name {
      font-size: 1.1rem;
      color: var(--amber-color);
      margin-bottom: 8px;
      border-bottom: 1px dotted var(--crt-dim);
      padding-bottom: 4px;
      text-shadow: 0 0 4px var(--amber-color);
    }

    .profile-field {
      font-size: 0.85rem;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .profile-label {
      color: var(--crt-dim);
    }

    .card-actions {
      margin-top: 10px;
      display: flex;
      justify-content: flex-end;
    }

    .btn-danger {
      border-color: var(--danger-color);
      color: var(--danger-color);
    }

    .btn-danger:hover {
      background: var(--danger-color);
      color: #000;
      box-shadow: 0 0 8px var(--danger-color);
    }

    /* Config Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 101;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      border: 2px solid var(--crt-color);
      background: var(--panel-bg);
      padding: 25px;
      max-width: 400px;
      width: 100%;
    }

    .modal-title {
      font-size: 1.1rem;
      margin-bottom: 15px;
      color: var(--amber-color);
    }

    .toggle-view-btn {
      font-size: 0.75rem;
      margin-top: 5px;
      background: transparent;
      border: none;
      color: var(--crt-dim);
      cursor: pointer;
      text-decoration: underline;
    }

    .toggle-view-btn:hover {
      color: var(--crt-color);
    }
  </style>
</head>
<body>

  <!-- LOCK SCREEN OVERLAY -->
  <div id="lock-screen">
    <div class="lock-box">
      <div class="lock-title">PRIVATE EYEZ TERMINAL</div>
      <div class="lock-sub">RESTRICTED DOSSIER ACCESS // ENTER PASSCODE</div>
      <input type="password" id="passcode-input" class="lock-input" placeholder="••••••••" autocomplete="off" />
      <button class="terminal-btn" onclick="authenticate()">AUTHENTICATE</button>
      <div id="lock-error" class="error-msg">ACCESS DENIED // INVALID KEY</div>
    </div>
  </div>

  <!-- MAIN TERMINAL APP -->
  <header>
    <div class="logo-text">PRIVATE EYEZ // NEPTUNE DOSSIER</div>
    <div class="header-actions">
      <button class="terminal-btn" onclick="openConfig()">⚙ CONFIG</button>
      <button class="terminal-btn btn-danger" onclick="lockTerminal()">LOCK</button>
    </div>
  </header>

  <div class="container">
    <!-- STATUS PANEL -->
    <div class="status-panel">
      <div>SYSTEM: ACTIVE // ACCESS LEVEL 3</div>
      <div>ENTRIES LOADED: <span id="entry-count">0</span></div>
      <div>
        <button class="terminal-btn" onclick="exportData()" style="padding: 2px 8px; font-size: 0.75rem;">EXPORT JSON</button>
      </div>
    </div>

    <!-- NEW DOSSIER ENTRY FORM -->
    <div class="entry-form">
      <div class="section-title">NEW SUBJECT ENTRY</div>
      <form id="dossier-form" onsubmit="addSubject(event)">
        <div class="form-grid">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="subject-name" class="form-control" required autocomplete="off" placeholder="e.g. Veronica Mars">
          </div>
          <div class="form-group">
            <label>Affiliation / Group</label>
            <input type="text" id="subject-group" class="form-control" placeholder="e.g. 09er / Newspaper / Staff">
          </div>
          <div class="form-group">
            <label>Known Hobbies / Habits</label>
            <input type="text" id="subject-hobbies" class="form-control" placeholder="e.g. Photography, Journalism">
          </div>
          <div class="form-group">
            <label>Field Notes / Intel</label>
            <input type="text" id="subject-notes" class="form-control" placeholder="e.g. Frequently seen near lockers">
          </div>
        </div>
        <button type="submit" class="terminal-btn">+ ADD TO DATABASE</button>
      </form>
    </div>

    <!-- DATABASE RECORDS LIST -->
    <div class="section-title">SUBJECT ARCHIVE</div>
    <div id="profiles-container" class="profiles-grid">
      <!-- Dynamic profile cards load here -->
    </div>
  </div>

  <!-- CONFIG MODAL -->
  <div id="config-modal" class="modal">
    <div class="modal-content">
      <div class="modal-title">SYSTEM CONFIGURATION</div>
      <div class="form-group" style="margin-bottom: 15px;">
        <label>Current Passcode</label>
        <input type="password" id="current-pass-display" class="form-control" readonly>
        <button class="toggle-view-btn" onclick="togglePasscodeVisibility()">Show / Hide Passcode</button>
      </div>
      <div class="form-group" style="margin-bottom: 15px;">
        <label>Set New Passcode</label>
        <input type="password" id="new-passcode-input" class="form-control" placeholder="Enter new code">
      </div>
      <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <button class="terminal-btn" onclick="updatePasscode()">SAVE</button>
        <button class="terminal-btn btn-danger" onclick="closeConfig()">CANCEL</button>
      </div>
    </div>
  </div>

  <script>
    // Storage Keys & Defaults
    const STORAGE_KEY = 'private_eyez_subjects';
    const PASSCODE_KEY = 'private_eyez_passcode';
    const DEFAULT_PASSCODE = 'neptune';

    let subjects = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let activePasscode = localStorage.getItem(PASSCODE_KEY) || DEFAULT_PASSCODE;

    // Authentication Logic
    function authenticate() {
      const enteredCode = document.getElementById('passcode-input').value.trim().toLowerCase();
      const errorMsg = document.getElementById('lock-error');

      if (enteredCode === activePasscode.toLowerCase()) {
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('passcode-input').value = '';
        errorMsg.style.display = 'none';
        renderSubjects();
      } else {
        errorMsg.style.display = 'block';
      }
    }

    // Support Enter key press on lock screen input
    document.getElementById('passcode-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        authenticate();
      }
    });

    function lockTerminal() {
      document.getElementById('lock-screen').style.display = 'flex';
    }

    // Render Subjects to Grid
    function renderSubjects() {
      const container = document.getElementById('profiles-container');
      const countDisplay = document.getElementById('entry-count');
      
      container.innerHTML = '';
      countDisplay.textContent = subjects.length;

      if (subjects.length === 0) {
        container.innerHTML = '<div style="color: var(--crt-dim); font-size: 0.9rem;">NO SUBJECT DOSSIERS FOUND IN DATABASE.</div>';
        return;
      }

      subjects.forEach((subj, index) => {
        const card = document.createElement('div');
        card.className = 'profile-card';
        card.innerHTML = `
          <div class="profile-name">${escapeHTML(subj.name)}</div>
          <div class="profile-field"><span class="profile-label">AFFILIATION:</span> ${escapeHTML(subj.group || 'N/A')}</div>
          <div class="profile-field"><span class="profile-label">HOBBIES:</span> ${escapeHTML(subj.hobbies || 'N/A')}</div>
          <div class="profile-field"><span class="profile-label">INTEL:</span> ${escapeHTML(subj.notes || 'N/A')}</div>
          <div class="card-actions">
            <button class="terminal-btn btn-danger" style="padding: 2px 6px; font-size: 0.75rem;" onclick="deleteSubject(${index})">PURGE</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Add New Subject
    function addSubject(event) {
      event.preventDefault();
      
      const newSubject = {
        name: document.getElementById('subject-name').value.trim(),
        group: document.getElementById('subject-group').value.trim(),
        hobbies: document.getElementById('subject-hobbies').value.trim(),
        notes: document.getElementById('subject-notes').value.trim()
      };

      subjects.push(newSubject);
      saveAndRender();
      document.getElementById('dossier-form').reset();
    }

    // Delete Subject
    function deleteSubject(index) {
      if (confirm('CONFIRM DELETION OF SUBJECT RECORD?')) {
        subjects.splice(index, 1);
        saveAndRender();
      }
    }

    function saveAndRender() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(subjects));
      renderSubjects();
    }

    // Export Data as JSON file
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(subjects, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "private_eyez_database.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    // Config Modal Controls
    function openConfig() {
      const passDisplay = document.getElementById('current-pass-display');
      passDisplay.value = activePasscode;
      passDisplay.type = 'password';
      document.getElementById('config-modal').style.display = 'flex';
    }

    function closeConfig() {
      document.getElementById('config-modal').style.display = 'none';
      document.getElementById('new-passcode-input').value = '';
    }

    function togglePasscodeVisibility() {
      const passDisplay = document.getElementById('current-pass-display');
      passDisplay.type = passDisplay.type === 'password' ? 'text' : 'password';
    }

    function updatePasscode() {
      const newCode = document.getElementById('new-passcode-input').value.trim();
      if (newCode) {
        activePasscode = newCode;
        localStorage.setItem(PASSCODE_KEY, activePasscode);
        alert('PASSCODE UPDATED SUCCESSFULLY.');
        closeConfig();
      } else {
        alert('PLEASE ENTER A VALID PASSCODE.');
      }
    }

    // Security Helper to Prevent HTML Injection
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }
  </script>
</body>
</html>
